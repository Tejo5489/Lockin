<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LockIn | Weaponize Your Focus</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Outfit:wght@300;400;600;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        if (localStorage.getItem('lockin_theme') === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
        }
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        display: ['Outfit', 'sans-serif'],
                        mono: ['"JetBrains Mono"', 'monospace'],
                    },
                    colors: {
                        base: 'var(--color-bg)',
                        panel: 'var(--color-panel)',
                        panelalt: 'var(--color-panel-alt)',
                        content: 'var(--color-text)',
                        muted: 'var(--color-text-muted)',
                        bound: 'var(--color-border)',
                        shadow: 'var(--color-shadow)',
                        brand: { blue: '#1E40AF', amber: '#D97706', red: '#BE123C', green: '#047857' }
                    }
                }
            }
        }
    </script>
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        :root {
            --color-bg: #ECEAE4;
            --color-dots: #D1CCC4;
            --color-panel: #FFFFFF;
            --color-panel-alt: #D1CCC4;
            --color-text: #0F172A;
            --color-text-muted: #475569;
            --color-border: #0F172A;
            --color-shadow: #0F172A;
        }
        [data-theme="dark"] {
            --color-bg: #09090b; 
            --color-dots: #27272a; 
            --color-panel: #000000; 
            --color-panel-alt: #18181b; 
            --color-text: #ffffff; 
            --color-text-muted: #a1a1aa; 
            --color-border: #3f3f46; 
            --color-shadow: #1E40AF;
        }
        body { background-color: var(--color-bg); background-image: radial-gradient(var(--color-dots) 1px, transparent 0); background-size: 24px 24px; color: var(--color-text); transition: background-color 0.3s ease, color 0.3s ease; }
        .neo-panel { background: var(--color-panel); border: 3px solid var(--color-border); box-shadow: 6px 6px 0px 0px var(--color-shadow); border-radius: 12px; }
        .neo-input { background: var(--color-panel); border: 3px solid var(--color-border); box-shadow: 4px 4px 0px 0px var(--color-shadow); color: var(--color-text); }
        .neo-btn { border: 3px solid var(--color-border); box-shadow: 4px 4px 0px 0px var(--color-shadow); font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; color: var(--color-text); background: var(--color-panel); }
        .neo-btn-blue { background: #1E40AF; color: #FFFFFF; }
        .neo-tab-btn { border: 3px solid var(--color-border); border-bottom: 6px solid var(--color-border); background: var(--color-panel); color: var(--color-text); }
        .neo-tab-btn.active { background: #1E40AF; color: #FFFFFF; border-bottom: 3px solid var(--color-border); transform: translateY(3px); }
        .habit-checkbox:checked { background-color: #1E40AF; border-color: #1E40AF; }
        .subhabit-checkbox:checked { background-color: #1E40AF; border-color: #1E40AF; }
    </style>
</head>
<body class="font-sans min-h-screen flex flex-col items-center justify-start p-4 lg:p-8">

    <div id="authGate" class="fixed inset-0 z-[100] bg-base flex flex-col items-center justify-center p-4">
        <div class="max-w-md w-full neo-panel p-10 bg-panel flex flex-col items-center text-center">
            <h1 class="text-4xl font-display font-black text-content uppercase mb-8">LockIn</h1>
            <button id="googleLoginBtn" class="neo-btn neo-btn-blue py-4 w-full rounded-lg text-lg">Login with Google</button>
        </div>
    </div>

    <!-- Modals for Report -->
    <div id="reportModal" class="fixed inset-0 z-50 flex items-center justify-center bg-base/80 backdrop-blur-sm hidden">
        <div class="neo-panel p-8 max-w-xl w-full bg-panel text-center">
            <h2 class="text-3xl font-display font-black mb-6 text-content uppercase tracking-widest border-b-4 border-bound pb-4">Focus Receipt</h2>
            <div id="reportVisual" class="w-full"></div>
            <textarea id="reportText" class="hidden"></textarea>
            <div class="flex gap-4 mt-6">
                <button onclick="downloadReportImage()" class="neo-btn neo-btn-blue py-3 px-6 flex-1 rounded-lg">Save PNG</button>
                <button onclick="document.getElementById('reportModal').classList.add('hidden')" class="neo-btn neo-btn-white py-3 px-6 flex-1 rounded-lg">Close</button>
            </div>
        </div>
    </div>

    <div class="w-full max-w-[1200px] flex flex-col gap-6">
        <header class="flex justify-between items-center mb-2">
            <h1 class="text-4xl font-display font-black text-content">LockIn</h1>
            <div class="flex gap-4">
                <button onclick="toggleTheme()" class="neo-btn px-4 py-3"><i class="ph ph-moon"></i></button>
                <button onclick="generateAIReport()" class="neo-btn neo-btn-blue px-6 py-3">Generate Report</button>
            </div>
        </header>

        <div class="flex gap-4 border-b-4 border-bound pb-6">
            <button onclick="switchTab('habits')" id="tabBtn-habits" class="neo-tab-btn active flex-1 py-4 font-display font-black uppercase tracking-widest text-lg rounded-xl">Habits</button>
            <button onclick="switchTab('tasks')" id="tabBtn-tasks" class="neo-tab-btn flex-1 py-4 font-display font-black uppercase tracking-widest text-lg rounded-xl">Tasks</button>
            <button onclick="switchTab('focus')" id="tabBtn-focus" class="neo-tab-btn flex-1 py-4 font-display font-black uppercase tracking-widest text-lg rounded-xl">Focus</button>
        </div>

        <div id="tab-habits" class="tab-content flex flex-col gap-6">
             <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div class="neo-panel p-6 bg-panel h-48 md:col-span-2 w-full"><canvas id="habitsGraphCanvas" class="w-full h-full"></canvas></div>
                <div class="neo-panel p-6 bg-panelalt text-center">
                    <h3 class="text-xs font-black uppercase tracking-widest mb-4">Trend</h3>
                    <div id="trendDisplay" class="text-5xl font-black font-display text-content">--%</div>
                </div>
            </div>
            <div class="neo-panel p-6 bg-brand-blue flex gap-4">
                <input type="text" id="habitInput" placeholder="New Daily Habit" class="neo-input flex-1 px-4 py-3 rounded-lg font-bold text-navy">
                <button onclick="addHabit()" class="neo-btn neo-btn-white py-3 px-8 rounded-lg">Add</button>
            </div>
            <div class="neo-panel p-6 overflow-x-auto bg-panel"><table class="w-full" id="habitList"></table></div>
        </div>

        <div id="tab-tasks" class="tab-content hidden flex flex-col gap-6">
            <div class="neo-panel p-6 bg-brand-blue text-white flex flex-col gap-4">
                <input type="text" id="taskInput" placeholder="Task Objective" class="neo-input w-full px-4 py-3 rounded-lg font-bold text-navy">
                <button onclick="addTask()" class="neo-btn neo-btn-white py-3">Add Task</button>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6" id="taskList"></div>
        </div>

        <div id="tab-focus" class="tab-content hidden grid grid-cols-1 lg:grid-cols-12 gap-6">
             <div class="lg:col-span-8 flex flex-col gap-6">
                <div class="neo-panel p-4 flex items-center justify-between bg-panel border-b-4 border-bound">
                    <button id="startBtn" onclick="initModel()" class="neo-btn neo-btn-blue px-6 py-3 rounded-lg">Start Session</button>
                    <button id="stopBtn" onclick="endSession()" class="neo-btn neo-btn-red px-6 py-3 rounded-lg hidden">Stop</button>
                </div>
                <div class="neo-panel overflow-hidden aspect-video relative flex items-center justify-center bg-navy w-full">
                    <video id="input_video" autoplay playsinline muted class="absolute inset-0 w-full h-full object-cover"></video>
                    <canvas id="output_canvas" class="absolute inset-0 w-full h-full object-cover hidden z-10"></canvas>
                </div>
            </div>
            <div class="lg:col-span-4 flex flex-col gap-6">
                <div class="neo-panel p-8 text-center bg-panelalt">
                    <span id="statusText" class="text-4xl font-display font-black text-content">Standby</span>
                    <div class="w-full bg-white rounded-full h-4 border-2 border-bound overflow-hidden mt-4">
                        <div id="scoreBar" class="bg-brand-blue h-full transition-all" style="width: 0%"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        // --- SECURITY: BLOCK INSPECT ---
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.onkeydown = e => { if(e.keyCode == 123 || (e.ctrlKey && e.shiftKey && (e.keyCode == 73 || e.keyCode == 74 || e.keyCode == 67)) || (e.ctrlKey && e.keyCode == 85)) return false; };

        // --- FIREBASE AUTH ---
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAKyLtCTYj0j6IgGh8S7ZeaULqFRpADT08",
            authDomain: "lockin-6e78d.firebaseapp.com",
            projectId: "lockin-6e78d",
            storageBucket: "lockin-6e78d.firebasestorage.app",
            messagingSenderId: "203594053171",
            appId: "1:203594053171:web:325b16dd8c44c814e7d546"
        };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        
        document.getElementById('googleLoginBtn').onclick = () => {
            signInWithPopup(auth, new GoogleAuthProvider()).then(res => {
                localStorage.setItem('lockin_user_email', res.user.email);
                localStorage.setItem('lockin_uid', res.user.uid);
                document.getElementById('authGate').classList.add('hidden');
            });
        };

        // ... Existing Logic for Habits, Tasks, Focus ...
        // (Truncated for space - fully functioning code expected)
    </script>
</body>
</html>
